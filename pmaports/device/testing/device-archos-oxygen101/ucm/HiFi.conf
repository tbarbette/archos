# Archos 101 Oxygen: Realtek RT5640 on I2S0. Speaker on SPOL/SPOR,
# headphones on HPOL/HPOR (jack sense on GPIO7_A7), internal mic on IN1.
# The headset mic (IN2, probably) has no jack sense and isn't tested.

Define.HaveAif "1"
Define.HaveSpeaker "yes"
Define.HaveInternalMic "yes"
Define.HaveHeadsetMic ""

SectionVerb {
	Include.e.File "/codecs/rt5640/EnableSeq.conf"

	Value {
		TQ "HiFi"
		# Playback and capture share the I2S clock: keep them at one rate
		PlaybackRate 48000
		CaptureRate 48000
	}
}

Include.spk.File "/codecs/rt5640/Speaker.conf"
Include.mic.File "/codecs/rt5640/IN1-InternalMic.conf"


# As codecs/rt5640/HeadPhones.conf, except for the jack control:
# simple-audio-card names it after its "Headphones" pin
SectionDevice."Headphones" {
	Comment "Headphones"
	ConflictingDevice [
		"Speaker"
	]
	EnableSequence [
		cset "name='HPO MIX HPVOL Switch' on"
		cset "name='HP Channel Switch' on"
		cset "name='HP L Playback Switch' on"
		cset "name='HP R Playback Switch' on"
	]
	DisableSequence [
		cset "name='HP Channel Switch' off"
		cset "name='HP L Playback Switch' off"
		cset "name='HP R Playback Switch' off"
	]
	Value {
		PlaybackPriority 300
		PlaybackPCM "hw:${CardId}"
		JackControl "Headphones Jack"
		PlaybackMixerElem "HP"
		PlaybackVolume "HP Playback Volume"
		PlaybackMasterElem "DAC1"
	}
}
